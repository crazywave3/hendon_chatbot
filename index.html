<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>핸드니</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e3e6ea;
    --text: #1d2329;
    --muted: #6b7580;
    --brand: #1f4fd8;
    --brand-text: #ffffff;
    --bot-bubble: #eef1f5;
    --warn-bg: #fff6e0;
    --warn-text: #7a5600;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --panel: #1c2024;
      --line: #2c3238;
      --text: #e8ebee;
      --muted: #8f99a3;
      --brand: #5b82f0;
      --brand-text: #0e1116;
      --bot-bubble: #272d33;
      --warn-bg: #3a3017;
      --warn-text: #f0cf80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }

  /* ---------- 공통 구조 (모바일 기준) ---------- */
  .app { display: flex; height: 100dvh; }
  .side { display: none; }
  .main {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    background: var(--panel);
  }
  header.top {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  header.top .logo {
    width: 34px; height: 34px; border-radius: 8px; object-fit: cover; display: block;
  }
  .side .logo-big { width: 64px; height: 64px; border-radius: 12px; display: block; margin-bottom: 10px; }
  header.top h1 { font-size: 16px; margin: 0; }
  header.top small { color: var(--muted); }

  .notice {
    background: var(--warn-bg); color: var(--warn-text);
    padding: 8px 16px; font-size: 13px;
  }

  #log {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.bot { background: var(--bot-bubble); align-self: flex-start; border-top-left-radius: 4px; }
  .msg.me { background: var(--brand); color: var(--brand-text); align-self: flex-end; border-top-right-radius: 4px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer;
  }

  form.input {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--panel);
  }
  form.input input {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font-size: 16px; /* iOS 확대 방지 */
  }
  form.input button {
    border: 0; border-radius: 12px; padding: 0 18px;
    background: var(--brand); color: var(--brand-text); font-size: 15px; cursor: pointer;
  }

  /* ---------- PC 화면 ---------- */
  @media (min-width: 900px) {
    .side {
      display: block; width: 280px; padding: 20px;
      border-right: 1px solid var(--line); background: var(--bg);
    }
    .side h2 { font-size: 13px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
    .side .chip { display: block; width: 100%; text-align: left; margin-bottom: 8px; border-radius: 10px; }
    .chips.mobile-only { display: none; }
    .main { max-width: 900px; margin: 0 auto; border-left: 0; }
    .msg { max-width: 70%; }
    #log { padding: 24px 32px; }
    form.input { padding: 14px 32px 18px; }
  }
</style>
</head>

      <div>
        <h1>핸드니</h1>
        <small>재고 · 바코드 · 주문현황</small>
      </div>
    </header>
    <div class="notice">샘플 데이터 모드입니다. 아직 이카운트·쇼핑몰과 연결되지 않았고, 아래 답변은 모두 예시입니다.</div>
    <div id="log" aria-live="polite"></div>
    <div class="chips mobile-only" id="main-chips"></div>
    <form class="input" id="form" autocomplete="off">
      <input id="q" type="text" placeholder="질문을 입력하세요" aria-label="질문 입력">
      <button type="submit">보내기</button>
    </form>
  </section>
</div>

<script>
/* =====================================================
   데이터 연결부: 지금은 샘플. 나중에 이 부분만
   이카운트/쇼핑몰 실제 호출로 교체한다.
   ===================================================== */
const dataSource = {
  isSample: true,
  items: [
    { code: "SAMPLE-001", name: "샘플상품 A", barcode: "0000000000011", stock: 120 },
    { code: "SAMPLE-002", name: "샘플상품 B", barcode: "0000000000028", stock: 0 },
    { code: "SAMPLE-003", name: "샘플상품 C", barcode: "0000000000035", stock: 37 },
  ],
  orders: [
    { channel: "샘플채널 1", count: 5 },
    { channel: "샘플채널 2", count: 2 },
  ],
  findItem(text) {
    const t = text.replace(/\s+/g, "").toLowerCase();
    return this.items.find(i =>
      t.includes(i.code.toLowerCase()) || t.includes(i.name.replace(/\s+/g, "").toLowerCase())
    );
  },
};

/* =====================================================
   질문 이해부: 키워드로 어떤 질문인지 구분
   (지금은 단순 방식. 나중에 AI로 교체 예정)
   ===================================================== */
function answer(text) {
  const t = text.replace(/\s+/g, "");
  const item = dataSource.findItem(text);
  const tag = dataSource.isSample ? "[샘플] " : "";

  if (t.includes("재고")) {
    if (item) return `${tag}${item.name}의 재고는 ${item.stock}개입니다.`;
    return `${tag}어떤 상품의 재고인지 알려주세요. 예: "샘플상품 A 재고"`;
  }
  if (t.includes("바코드")) {
    if (item) return `${tag}${item.name}의 바코드는 ${item.barcode}입니다.`;
    return `${tag}어떤 상품의 바코드인지 알려주세요. 예: "샘플상품 B 바코드"`;
  }
  if (t.includes("주문")) {
    const lines = dataSource.orders.map(o => `· ${o.channel}: ${o.count}건`).join("\n");
    return `${tag}채널별 주문 현황입니다.\n${lines}`;
  }
  return "이 질문은 아직 답할 수 없습니다. 지금은 재고, 바코드, 주문현황 질문만 받습니다.";
}

/* ---------- 화면 동작 ---------- */
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("q");
const suggestions = ["샘플상품 A 재고", "샘플상품 B 바코드", "오늘 주문현황"];

function add(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function ask(text) {
  const v = text.trim();
  if (!v) return;
  add("me", v);
  add("bot", answer(v));
}
function makeChips(el) {
  suggestions.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = s;
    b.addEventListener("click", () => ask(s));
    el.appendChild(b);
  });
}
makeChips(document.getElementById("side-chips"));
makeChips(document.getElementById("main-chips"));

form.addEventListener("submit", e => {
  e.preventDefault();
  ask(input.value);
  input.value = "";
});

add("bot", "안녕하세요, 핸드니입니다. 재고, 바코드, 주문현황을 물어보세요.");
</script>
</body>
</html>
